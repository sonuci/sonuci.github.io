body[data-theme="socks"] .layer{opacity:0!important;visibility:hidden!important}
body[data-theme="socks"] #l-socks{opacity:1!important;visibility:visible!important;transition-delay:0s}
@media(max-width:700px){
  body[data-theme="socks"] #l-socks::before{right:4%;top:9%;width:31vw;height:34vh;opacity:.5;border-radius:12px}
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:var(--fs)/1.4 var(--font);color:var(--fg);background:var(--bg);overflow:hidden;-webkit-text-size-adjust:100%}
::selection{background:var(--accent);color:var(--ink)}
button{font:inherit}

/* ───────── обои ───────── */
#wall{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#wall::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(0,0,0,.55) 100%)}
.layer{position:absolute;inset:-6%;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
body[data-theme="space"] #l-space,body[data-theme="sunset"] #l-sunset{opacity:1;visibility:visible;transition-delay:0s}
#l-space{
  background:
    radial-gradient(circle at 24% 58%,#04020a 0 15%,transparent 15.4%),
    radial-gradient(circle at 24% 58%,transparent 14.4%,rgba(198,142,255,.9) 15.6%,rgba(132,70,214,.45) 19%,transparent 34%),
    radial-gradient(circle at 76% 72%,#05030c 0 5.4%,transparent 5.7%),
    radial-gradient(circle at 76% 72%,transparent 5.1%,rgba(120,190,255,.6) 6%,transparent 12%),
    radial-gradient(ellipse at 82% 8%,rgba(255,110,200,.30),transparent 46%),
    radial-gradient(ellipse at 8% 92%,rgba(110,90,255,.32),transparent 52%),
    linear-gradient(160deg,#2b1357 0%,#150a2f 46%,#0a0616 100%);
  filter:blur(3px);
}
#l-space::after{
  content:"";position:absolute;inset:0;opacity:.85;
  background:
    radial-gradient(1.6px 1.6px at 12% 18%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 33% 9%,#dcd0ff,transparent),
    radial-gradient(1.4px 1.4px at 47% 31%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 61% 14%,#cfe4ff,transparent),
    radial-gradient(1.6px 1.6px at 78% 27%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 90% 44%,#e6d9ff,transparent),
    radial-gradient(1.4px 1.4px at 8% 71%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 52% 84%,#cfe4ff,transparent),
    radial-gradient(1.6px 1.6px at 69% 90%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 93% 82%,#dcd0ff,transparent);
}
#l-sunset{
  background:
    radial-gradient(ellipse 55% 36% at 52% 76%,rgba(255,200,115,.95),rgba(244,150,70,.5) 42%,transparent 74%),
    linear-gradient(180deg,#14304a 0%,#244d6e 32%,#4d7b92 54%,#d99a58 73%,#f1b873 79%,#1b2d38 79.3%,#0f1d27 100%);
  filter:blur(5px);
}
#forest{position:absolute;inset:0;width:100%;height:100%}

/* ───────── «оконный менеджер» ───────── */
#wm{
  position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:var(--gap);
  padding:max(var(--gap),env(safe-area-inset-top)) max(var(--gap),env(safe-area-inset-right)) max(var(--gap),env(safe-area-inset-bottom)) max(var(--gap),env(safe-area-inset-left));
}
.bar,.win{
  background:var(--win);border:1px solid var(--border);border-radius:5px;
  -webkit-backdrop-filter:blur(7px) saturate(1.15);backdrop-filter:blur(7px) saturate(1.15);
}
.bar{flex:none;height:30px;display:flex;align-items:center;gap:14px;padding:0 6px;font-size:12.5px;white-space:nowrap;overflow:hidden;background:var(--bar)}

/* верхняя панель (polybar) */
#bar{justify-content:space-between}
#bar .grp{display:flex;align-items:center;gap:16px;flex:none}
#bar .np{flex:1;min-width:0;text-align:center;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
#bar i{font-style:normal}
#bar .mod b{color:var(--accent);font-weight:700}
.ws{display:flex;gap:4px}
.ws span{min-width:22px;padding:0 6px;text-align:center;border-radius:3px;color:var(--dim)}
.ws span.on{background:var(--accent);color:var(--ink);font-weight:700}

/* плитки */
#tiles{flex:1;min-height:0;display:grid;gap:var(--gap);grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.win{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.win.focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--glow),0 10px 34px rgba(0,0,0,.38)}
#w-term{grid-row:1/3}

/* терминал */
#scr{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 16px 16px;cursor:text;white-space:pre-wrap;overflow-wrap:anywhere;scrollbar-width:thin;scrollbar-color:var(--dim) transparent;overscroll-behavior:contain}
.ln{min-height:1.4em}
.dim{color:var(--dim)}
.acc{color:var(--accent)}
.lab{color:var(--label);font-weight:700}
.ok{color:var(--ok)}
.err{color:var(--err)}
a.link{color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
a.link:hover,a.link:focus-visible{background:var(--accent);color:var(--ink);text-decoration:none;outline:none}
.grid2{display:grid;grid-template-columns:max-content 1fr;gap:0 2.5ch;white-space:normal;margin:2px 0}
.grid3{display:grid;grid-template-columns:max-content max-content 1fr;gap:0 2.5ch;white-space:normal;margin:2px 0}

/* строка приглашения в стиле powerline (рисуется CSS-ом, шрифты не нужны) */
.prompt{display:flex;align-items:center;min-height:1.5em;margin:1px 0}
.prompt.done{align-items:flex-start}
.ps1{display:inline-flex;flex:none;margin-right:1.35em}
.seg{position:relative;display:block;height:1.5em;line-height:1.5em;padding:0 .8em;color:#fff;font-weight:700;white-space:nowrap}
.seg::after{content:"";position:absolute;left:100%;top:0;border:solid transparent;border-width:.75em 0 .75em .75em}
.s1{background:var(--seg1);z-index:2}
.s1::after{border-left-color:var(--seg1)}
.s2{background:var(--seg2);padding-left:1.45em;z-index:1}
.s2::after{border-left-color:var(--seg2)}
.typed{min-width:0}
#in{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:0;color:var(--fg);font:inherit;caret-color:var(--accent);caret-shape:block}

/* fastfetch / neofetch */
.ff{display:flex;flex-wrap:wrap;gap:10px 3ch;align-items:flex-start;margin:6px 0 10px;white-space:normal}
.ff-logo img{display:block;width:clamp(130px,17vw,224px);height:auto;aspect-ratio:1;object-fit:cover;border:1px solid var(--border);border-radius:5px}
.ff-arch{margin:8px 0 0;color:var(--label);font:700 10px/1.05 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;overflow:hidden}
.ff-info{flex:1 1 32ch;min-width:0}
.ff-title{font-weight:700}
.ff-title .u{color:var(--label)}
.ff-sep{color:var(--dim)}
.ff-row{display:flex}
.ff-k{color:var(--label);font-weight:700;flex:none;white-space:pre}
.ff-c{flex:none;white-space:pre}
.ff-v{min-width:0;overflow-wrap:anywhere}
.ff-gap{height:.7em}
.ff-colors div{display:flex}
.ff-colors i{display:block;width:3ch;height:1.5em}

/* файловый менеджер (ranger) со ссылками */
#w-files{padding-top:8px;font-size:13px}
.rg-head{padding:0 12px 6px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg-head .u{color:var(--ok)}
.rg-head .p{color:var(--blue)}
.rg-list{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
.rg-row{display:flex;gap:1.2ch;padding:0 12px;line-height:1.6;color:var(--label);text-decoration:none;white-space:nowrap;outline:none}
.rg-row .n{font-weight:700;flex:none}
.rg-row .ar,.rg-row .t{color:var(--dim)}
.rg-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rg-row.sel{background:var(--sel-bg);color:var(--ink)}
.rg-row.sel .ar,.rg-row.sel .t{color:var(--ink)}
.rg-foot{padding:3px 12px;border-top:1px solid var(--border);color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* htop */
#w-htop{padding-top:8px;font-size:12.5px}
.ht{padding:0 12px 8px;white-space:pre;overflow:hidden;line-height:1.45;font:inherit;line-height:1.45}
.ht .g{color:#98c379}.ht .r{color:#e06c75}.ht .b{color:#61afef}.ht .y{color:#e5c07b}
.ht b{color:#fff}
.fk{display:flex;overflow:hidden;white-space:pre;font-size:12px}
.fk b{color:#e8e8e8;font-weight:400;padding-left:.4em}
.fk i{font-style:normal;background:#3ec1d3;color:#0b0b12}

/* нижняя панель: кнопки-команды */
#dock{padding:0;gap:0}
#chips{display:flex;flex:1;min-width:0;height:100%;overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:100%;padding:0 14px;border:0;border-right:1px solid rgba(0,0,0,.28);background:var(--c);color:#12121c;font-weight:700;cursor:pointer}
.chip:hover{filter:brightness(1.14)}
.chip:focus-visible{outline:none;box-shadow:inset 0 0 0 2px #12121c}

  #tiles{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}

<body data-theme="space">
<div id="wall" aria-hidden="true">
  <div class="layer" id="l-space"></div>
  <div class="layer" id="l-sunset"><svg id="forest" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice"><g id="forest-g"></g></svg></div>
  <div class="layer" id="l-socks"></div>
</div>

<div id="wm">
  <header class="bar" id="bar" aria-hidden="true">
    <div class="grp"><div class="ws"><span class="on">1</span><span>2</span><span>3</span><span>4</span><span>5</span></div></div>
    <div class="np" id="np"></div>
    <div class="grp">
      <span class="mod m-mem"><b>MEM</b> <i id="b-mem"></i></span>
      <span class="mod m-cpu"><b>CPU</b> <i id="b-cpu"></i></span>
      <span class="mod m-net"><b>↓</b> <i id="b-rx"></i> <b>↑</b> <i id="b-tx"></i></span>
      <span class="mod m-bat"><b>BAT</b> <i>99%</i></span>
      <span class="mod" id="b-clock"></span>
    </div>
  </header>

  <main id="tiles">
    <section class="win focus" id="w-term" aria-label="терминал">
      <div id="scr" role="log" aria-live="polite"></div>
    </section>

    <aside class="win" id="w-files" aria-label="ссылки">
      <div class="rg-head" id="rg-head"></div>
      <div class="rg-list" id="rg-list"></div>
      <div class="rg-foot" id="rg-foot"></div>
    </aside>

    <aside class="win" id="w-htop" aria-hidden="true">
      <pre class="ht" id="ht"></pre>
      <div class="fk"><b>F1</b><i>Help  </i><b>F2</b><i>Setup </i><b>F3</b><i>Search</i><b>F4</b><i>Filter</i><b>F5</b><i>Tree  </i><b>F6</b><i>SortBy</i><b>F10</b><i>Quit  </i></div>
    </aside>
  </main>

  <footer class="bar" id="dock" aria-label="быстрые команды"><div id="chips"></div></footer>
</div>

<!-- ═══════════════════════════════════════════════════════════
     НАСТРОЙКИ. Всё, что нужно менять, — вот в этом блоке.
     ═══════════════════════════════════════════════════════════ -->
<script>
const CONFIG = {
  nick: "sonucii",                       // твой ник: nick@arch, fastfetch, название вкладки
  host: "arch",                       // «имя компьютера»: nick@host
  defaultTheme: "space",              // space, sunset, cyber, ocean, rose, matrix, mono
  openMode: "newtab",                 // что делает команда discord и т.п.:
                                      //   "newtab" — открыть в новой вкладке, "same" — перекинуть в этой же, "off" — только показать ссылку
  nowPlaying: "lofi hip hop radio",   // надпись «играет сейчас» сверху ("" — убрать)

  about: [
    "привет! я sonucii :3",
    "добро пожаловать в мой терминал.",
  ],

  // Соцсети. cmd — слово, которое пишут в терминале; label — красивое название;
  // handle — ник/тег (его видно в fastfetch; удали строку handle, чтобы не показывать); url — ссылка.
  socials: [
    { cmd: "spotify", label: "Spotify", handle: "sonucii", url: "https://open.spotify.com/user/316o3pwekozyybab3nazjyv3h37m", fetch: false },
    { cmd: "telegram", label: "Telegram", handle: "@sonuci", url: "https://t.me/sonuci", fetch: false },
    { cmd: "steam", label: "Steam", handle: "sonucii", url: "https://steamcommunity.com/profiles/76561199636942001/", fetch: false },
    { cmd: "roblox", label: "Roblox", handle: "profile", url: "https://www.roblox.com/users/7158028045/profile", fetch: false },
    { cmd: "twitch", label: "Twitch", handle: "@sonuciii1337", url: "https://www.twitch.tv/sonuciii1337", fetch: false },
    { cmd: "gunslol", label: "guns.lol", handle: "@sonucii", url: "https://guns.lol/sonucii", fetch: false },
  ],

  // «Железо» для fastfetch / neofetch — впиши своё.
  system: {
    os: "Arch Linux x86_64",
    machine: "Custom PC",
    kernel: "6.6.30-1-lts",
    packages: "1042 (pacman)",
    shell: "bash 5.2.26",
    resolution: "auto",               // "auto" — разрешение экрана того, кто зашёл; или впиши "1920x1080"
    refresh: 144,
    wm: "i3",
    theme: "Arc-Dark [GTK2/3]",
    icons: "Papirus-Dark [GTK2/3]",
    terminal: "alacritty",
    font: "JetBrainsMono Nerd Font",
    cpu: "AMD Ryzen 5 5600X (12) @ 4.65 GHz",
    gpu: ["NVIDIA GeForce RTX 3060"],
    memTotal: 16384,                  // МиБ
  },

  // Проекты (команда projects появится сама, если список не пустой):
  // { name: "мой-проект", desc: "что это", url: "https://github.com/..." }
  projects: [],
};
</script>

<script>
(() => {
"use strict";
const C = CONFIG;
const $ = (s, r = document) => r.querySelector(s);
const T0 = Date.now();
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const coarse = matchMedia("(pointer: coarse)").matches;
const THEMES = { space: "#0b0616", sunset: "#0f1a28", cyber: "#070b14", ocean: "#061522", rose: "#1b0b17", matrix: "#030b06", mono: "#111114", socks: "#100b0d" };
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hasAvatar = () => typeof AVATAR === "string" && AVATAR.startsWith("data:");

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const safeUrl = (u) => {
  try { const x = new URL(u); return /^(https?:|mailto:)$/.test(x.protocol) ? x.href : ""; }
  catch { return ""; }
};
const pretty = (u) => String(u).replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");

/* ───────── терминал: вывод ───────── */
let scr, promptEl, input;
const hist = [];
let hpos = 0;
const CMD = new Map();
const HELP = [];
const def = (name, desc, fn) => { CMD.set(name, fn); if (desc) HELP.push([name, desc]); };

const put = (node) => scr.insertBefore(node, promptEl);
const toBottom = () => { scr.scrollTop = scr.scrollHeight; };
const frag = (parts) => {
  const f = document.createDocumentFragment();
  for (const p of [].concat(parts)) {
    if (p == null || p === "") continue;
    if (typeof p === "string" || p instanceof Node) { f.append(p); continue; }
    const href = p.href ? safeUrl(p.href) : "";
    const n = el(href ? "a" : "span", p.c || "", p.t);
    if (href) { n.href = href; n.target = "_blank"; n.rel = "noopener noreferrer"; }
    f.append(n);
  }
  return f;
};
const line = (...parts) => { const d = el("div", "ln"); d.append(frag(parts)); put(d); return d; };
const ps1 = () => {
  const w = el("span", "ps1");
  w.append(el("span", "seg s1", C.nick), el("span", "seg s2", C.host));
  return w;
};
const echo = (cmd) => { const d = el("div", "prompt done"); d.append(ps1(), el("span", "typed", cmd)); put(d); };
const clearScreen = () => { while (scr.firstChild && scr.firstChild !== promptEl) scr.firstChild.remove(); };

function openTab(url) {
  const a = el("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
  document.body.append(a); a.click(); a.remove();
}

/* ───────── «датчики» (для панелей и fastfetch) ───────── */
const sim = { cpu: [22, 12, 36, 9], mem: 3600, rx: 1.5, tx: 5, l5: 0.9, l15: 0.8 };
function stepSim() {
  sim.cpu = sim.cpu.map((v) => clamp(v + (Math.random() - 0.5) * 18, 3, 92));
  sim.mem = clamp(sim.mem + (Math.random() - 0.5) * 70, 2600, 5200);
  sim.rx = clamp(sim.rx + (Math.random() - 0.5) * 1.2, 0.1, 9);
  sim.tx = clamp(sim.tx + (Math.random() - 0.5) * 4, 1, 40);
  const l1 = (sim.cpu.reduce((a, b) => a + b, 0) / 100);
  sim.l5 += (l1 - sim.l5) * 0.06;
  sim.l15 += (l1 - sim.l15) * 0.025;
}
const uptimeStr = () => {
  const m = Math.floor((Date.now() - T0) / 60000);
  const h = Math.floor(m / 60), mm = m % 60;
  const p = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  return h ? `${p(h, "hour")}, ${p(mm, "min")}` : p(mm, "min");
};
const hms = () => {
  const s = Math.floor((Date.now() - T0) / 1000);
  const p = (n) => String(n).padStart(2, "0");
  return `${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`;
};

function cellsToHtml(cells) {
  let out = "", cur = "", buf = "";
  const flush = () => { if (buf) out += cur ? `<span class="${cur}">${buf}</span>` : buf; buf = ""; };
  for (const [ch, c] of cells) { if (c !== cur) { flush(); cur = c; } buf += ch; }
  flush();
  return out;
}
function meterHtml(pct, W, label) {
  const n = Math.round((W * pct) / 100), kern = Math.round(n * 0.22);
  const cells = [];
  for (let i = 0; i < W; i++) {
    const li = i - (W - label.length);
    if (li >= 0) cells.push([label[li], "dim"]);
    else if (i < n - kern) cells.push(["|", "g"]);
    else if (i < n) cells.push(["|", "r"]);
    else cells.push([" ", ""]);
  }
  return cellsToHtml(cells);
}
function memHtml(W) {
  const total = C.system.memTotal || 16384, used = sim.mem;
  const label = `${(used / 1024).toFixed(1)}G/${(total / 1024).toFixed(1)}G`;
  const cells = Array.from({ length: W }, () => [" ", ""]);
  let i = 0;
  for (const [c, n] of [["g", Math.round((W * used) / total)], ["b", 1], ["y", 2]]) {
    for (let k = 0; k < n && i < W; k++, i++) cells[i] = ["|", c];
  }
  for (let k = 0; k < label.length; k++) cells[W - label.length + k] = [label[k], "dim"];
  return cellsToHtml(cells);
}
function renderHtop() {
  const W = 26;
  let h = "";
  sim.cpu.forEach((v, i) => { h += `<span class="dim">${i + 1}</span> [${meterHtml(v, W, v.toFixed(1) + "%")}]\n`; });
  h += `<span class="dim">Mem</span>[${memHtml(W)}]\n`;
  h += `<span class="dim">Swp</span>[${cellsToHtml(Array.from({ length: W }, (_, i) => { const t = "0K/2.00G"; const k = i - (W - t.length); return k >= 0 ? [t[k], "dim"] : [" ", ""]; }))}]\n\n`;
  h += `Tasks: <b>106</b>, <span class="g">594</span> thr; <span class="g">1</span> running\n`;
  const l1 = sim.cpu.reduce((a, b) => a + b, 0) / 100;
  h += `Load average: <b>${l1.toFixed(2)}</b> ${sim.l5.toFixed(2)} ${sim.l15.toFixed(2)}\n`;
  h += `Uptime: <b>${hms()}</b>`;
  $("#ht").innerHTML = h;   // тут только числа и | — пользовательского текста нет
}
function renderBar() {
  const avg = sim.cpu.reduce((a, b) => a + b, 0) / sim.cpu.length;
  $("#b-mem").textContent = (sim.mem / 1024).toFixed(1) + "G";
  $("#b-cpu").textContent = Math.round(avg) + "%";
  $("#b-rx").textContent = sim.rx.toFixed(1) + " MB/s";
  $("#b-tx").textContent = Math.round(sim.tx) + " KB/s";
}
function renderClock() {
  const d = new Date();
  const date = d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  const time = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  $("#b-clock").textContent = `${date} ${d.getFullYear()}  ${time}`;
}
function startTicker() {
  const draw = () => { renderBar(); renderHtop(); };
  stepSim(); draw(); renderClock();
  setInterval(renderClock, 15000);
  if (!reduceMotion) setInterval(() => { if (!document.hidden) { stepSim(); draw(); } }, 1500);
}

/* ───────── fastfetch / neofetch ───────── */
const PALETTE = [
  ["#3f4451", "#e06c75", "#98c379", "#e5c07b", "#61afef", "#c678dd", "#56b6c2", "#abb2bf"],
  ["#5c6370", "#ff7b86", "#b5e890", "#f0d28a", "#7cc4ff", "#e08cf5", "#6fd3de", "#ffffff"],
];
function fetchView(kind) {
  const S = C.system;
  const res = S.resolution === "auto" ? `${window.screen.width}x${window.screen.height}` : S.resolution;
  const total = S.memTotal || 16384, used = Math.round(sim.mem);
  const gib = (x) => (x / 1024).toFixed(2);
  const gpus = [].concat(S.gpu || []).map((g) => ["GPU", g]);
  const locale = (navigator.language || "en-US").split("@")[0].replace("-", "_") + ".UTF-8";
  const rows = kind === "neofetch"
    ? [["OS", S.os], ["Host", S.machine], ["Kernel", S.kernel], ["Uptime", uptimeStr()], ["Packages", S.packages],
       ["Shell", S.shell], ["Resolution", res], ["WM", S.wm], ["Theme", S.theme], ["Icons", S.icons],
       ["Terminal", S.terminal], ["Terminal Font", S.font], ["CPU", S.cpu], ...gpus,
       ["Memory", `${used}MiB / ${total}MiB`]]
    : [["OS", S.os], ["Host", S.machine], ["Kernel", "Linux " + S.kernel], ["Uptime", uptimeStr()], ["Packages", S.packages],
       ["Shell", S.shell], ["Display", `${res} @ ${S.refresh} Hz`], ["WM", S.wm], ["Terminal", S.terminal],
       ["Terminal Font", S.font], ["CPU", S.cpu], ...gpus,
       ["Memory", `${gib(used)} GiB / ${gib(total)} GiB (${Math.round((used / total) * 100)}%)`], ["Locale", locale]];
  C.socials.forEach((s) => { if (s.handle && s.fetch !== false) rows.push([s.label, s.handle]); });

  const root = el("div", "ff");
  if (hasAvatar()) {
    const logo = el("div", "ff-logo");
    const img = el("img");
    img.src = AVATAR; img.alt = `${C.nick}: аватарка`; img.width = 224; img.height = 224;
    img.addEventListener("load", toBottom);
    logo.append(img);
    const arch = el("pre", "ff-arch", "   /\\\n  /  \\\n /____\\\n   ARCH");
    arch.setAttribute("aria-label", "Arch Linux ASCII logo");
    logo.append(arch);
    root.append(logo);
  }
  const info = el("div", "ff-info");
  const title = el("div", "ff-title");
  title.append(el("span", "u", C.nick), "@", el("span", "u", C.host));
  info.append(title, el("div", "ff-sep", "-".repeat(C.nick.length + C.host.length + 1)));
  rows.filter(([, v]) => v).forEach(([k, v]) => {
    const r = el("div", "ff-row");
    r.append(el("span", "ff-k", k), el("span", "ff-c", ": "), el("span", "ff-v", v));
    info.append(r);
  });
  const colors = el("div", "ff-colors");
  PALETTE.forEach((row) => {
    const d = el("div");
    row.forEach((c) => { const i = el("i"); i.style.background = c; d.append(i); });
    colors.append(d);
  });
  info.append(el("div", "ff-gap"), colors);
  root.append(info);
  return root;
}

/* ───────── команды ───────── */
const SOCIAL_ICONS = { spotify: "♫", telegram: "➤", steam: "◉", roblox: "◇", twitch: "▣", gunslol: "↗", discord: "◈", github: "⌘", youtube: "▶", tiktok: "♪", instagram: "◎" };
function openSocial(s) {
  const icon = SOCIAL_ICONS[s.cmd] || "◇";
  line({ t: `  ${icon}  ${s.label.toUpperCase()}`, c: "lab" });
  line({ t: "  └─ ", c: "dim" }, { t: `${s.cmd} ${s.handle || ""}`.trim(), c: "acc" });
  const url = safeUrl(s.url);
  if (!url) return line({ t: `${s.cmd}: ссылка не настроена`, c: "err" });
  line({ t: "→ ", c: "acc" }, `${s.label}${s.handle ? " (" + s.handle + ")" : ""}: `, { t: pretty(url), href: url, c: "link" });
  if (C.openMode === "same") { line({ t: "перекидываю…", c: "dim" }); setTimeout(() => location.assign(url), 350); }
  else if (C.openMode !== "off") openTab(url);
}
function setTheme(t, persist = true) {
  document.body.dataset.theme = t;
  $('meta[name="theme-color"]').content = THEMES[t];
  if (persist) { try { localStorage.setItem("rice-theme", t); } catch { /* ок */ } }
}
const FILES = {
  "about.txt": () => C.about,
  "socials.txt": () => C.socials.map((s) => `${s.label}: ${s.handle || pretty(s.url)}`),
};

def("help", "список команд", () => {
  line({ t: "команды:", c: "dim" });
  const g = el("div", "grid2");
  HELP.forEach(([n, d]) => g.append(el("span", "acc", n), el("span", "", d)));
  put(g);
  line({ t: "Tab — дописать команду, ↑/↓ — история, Ctrl+L — очистить", c: "dim" });
});
def("fastfetch", "инфа о системе (+ моя ава)", () => put(fetchView("fastfetch")));
def("neofetch", "то же самое, но по-старому", () => put(fetchView("neofetch")));
def("about", "обо мне", () => C.about.forEach((t) => line(t)));
def("socials", "все мои ссылки", () => {
  const g = el("div", "grid3");
  C.socials.forEach((s) => {
    const url = safeUrl(s.url);
    g.append(el("span", "acc", s.cmd), el("span", "", s.handle || ""), url ? frag({ t: pretty(url), href: url, c: "link" }) : el("span", "dim", "—"));
  });
  put(g);
});
C.socials.forEach((s) => { if (s.cmd && !CMD.has(s.cmd.toLowerCase())) def(s.cmd.toLowerCase(), `открыть ${s.label}`, () => openSocial(s)); });
if (Array.isArray(C.projects) && C.projects.length) {
  def("projects", "мои проекты", () => C.projects.forEach((p) =>
    line({ t: p.name, c: "lab" }, "  ", { t: p.desc || "", c: "dim" }, p.url ? "  " : "", p.url ? { t: pretty(p.url), href: p.url, c: "link" } : "")));
}
def("theme", "сменить тему: space / sunset / cyber / ocean / rose / matrix / mono / socks", (args) => {
  const names = Object.keys(THEMES), cur = document.body.dataset.theme;
  const name = args[0] === "toggle" ? names[(names.indexOf(cur) + 1) % names.length] : args[0];
  if (!name) return line("theme: ", { t: cur, c: "acc" }, { t: `   (есть: ${names.join(", ")})`, c: "dim" });
  if (!has(THEMES, name)) return line({ t: `theme: нет такой темы «${name}»`, c: "err" });
  setTheme(name);
  line({ t: `ok → ${name}`, c: "ok" });
});
def("ls", "файлы (ls, cat about.txt)", () => line(...Object.keys(FILES).flatMap((f) => [f, "   "])));
def("cat", null, (args) => {
  if (!args[0]) return line({ t: "cat: missing file operand", c: "err" });
  if (!has(FILES, args[0])) return line({ t: `cat: ${args[0]}: No such file or directory`, c: "err" });
  FILES[args[0]]().forEach((t) => line(t));
});
def("clear", "очистить экран", clearScreen);
def("whoami", null, () => line(C.nick));
def("hostname", null, () => line(C.host));
def("pwd", null, () => line(`/home/${C.nick}`));
def("date", null, () => line(new Date().toString()));
def("uptime", null, () => line(`up ${uptimeStr()}, 1 user`));
def("uname", null, (a) => line(a.includes("-a") ? `Linux ${C.host} ${C.system.kernel} #1 SMP PREEMPT_DYNAMIC x86_64 GNU/Linux` : "Linux"));
def("echo", null, (_a, raw) => line(raw.replace(/^echo\s*/i, "")));
def("cd", null, (a) => { if (a[0] && !["~", "/", ".", ".."].includes(a[0])) line({ t: `bash: cd: ${a[0]}: No such file or directory`, c: "err" }); });
def("sudo", null, () => line(`${C.nick} is not in the sudoers file. This incident will be reported.`));
def("rm", null, (a) => {
  if (a.some((x) => x === "/" || x === "/*")) { line("rm: it is dangerous to operate recursively on '/'"); line("rm: use --no-preserve-root to override this failsafe"); }
  else line({ t: `rm: cannot remove '${a.filter((x) => !x.startsWith("-")).join(" ") || "?"}': Permission denied`, c: "err" });
});
def("exit", null, () => { line("logout"); line({ t: "отсюда не выйти :)", c: "dim" }); });

const notFound = (cmd) => {
  line({ t: `bash: ${cmd}: command not found`, c: "err" });
  line({ t: "подсказка: help", c: "dim" });
};

function run(raw) {
  echo(raw);
  const text = raw.trim();
  if (text) {
    const [cmd, ...args] = text.split(/\s+/);
    const fn = CMD.get(cmd.toLowerCase());
    try { fn ? fn(args, text) : notFound(cmd); }
    catch (err) { line({ t: String(err), c: "err" }); console.error(err); }
  }
  toBottom();
}

function complete() {
  const val = input.value;
  let head = "", part = val, pool = [...CMD.keys()];
  if (/\s/.test(val.trimStart())) {
    const cmd = val.trim().split(/\s+/)[0].toLowerCase();
    part = val.endsWith(" ") ? "" : val.split(/\s+/).pop();
    head = val.slice(0, val.length - part.length);
    pool = cmd === "theme" ? [...Object.keys(THEMES), "toggle"] : cmd === "cat" ? Object.keys(FILES) : [];
  }
  const hits = pool.filter((p) => p.startsWith(part));
  if (!hits.length) return;
  const common = hits.reduce((a, b) => { let i = 0; while (i < a.length && a[i] === b[i]) i++; return a.slice(0, i); });
  if (common.length > part.length) input.value = head + common + (hits.length === 1 ? " " : "");
  else if (hits.length > 1) { echo(val); line(hits.join("   ")); toBottom(); }
}

/* ───────── построение интерфейса ───────── */
function buildPrompt() {
  promptEl = el("form", "prompt");
  promptEl.autocomplete = "off";
  input = el("input");
  input.id = "in"; input.type = "text"; input.autocomplete = "off"; input.spellcheck = false; input.enterKeyHint = "go";
  input.setAttribute("autocapitalize", "off");
  input.setAttribute("autocorrect", "off");
  input.setAttribute("aria-label", "ввод команды");
  promptEl.append(ps1(), input);
  scr.append(promptEl);
}
function buildForest() {
  const g = $("#forest-g");
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const pine = (cx, base, h, w) => {
    const n = 6, top = base - h, R = [];
    for (let i = 1; i <= n; i++) {
      const y = top + (h * 0.92 * i) / n, half = w * (0.35 + (0.65 * i) / n);
      R.push([cx + half, y]);
      if (i < n) R.push([cx + half * 0.3, y - ((h * 0.92) / n) * 0.35]);
    }
    const ty = top + h * 0.92, tw = w * 0.06;
    const L = R.map(([x, y]) => [2 * cx - x, y]).reverse();
    return [[cx, top], ...R, [cx + tw, ty], [cx + tw, base], [cx - tw, base], [cx - tw, ty], ...L]
      .map((p) => p.map(Math.round).join(",")).join(" ");
  };
  let out = "";
  for (let x = -40; x < 1660; x += 28 + rnd() * 34) out += `<polygon points="${pine(x, 900, 230 + rnd() * 190, 46 + rnd() * 26)}" fill="#254a5a" opacity=".55"/>`;
  for (let x = -60; x < 1660; x += 40 + rnd() * 50) {
    if (x > 460 && x < 1120 && rnd() < 0.85) continue;
    out += `<polygon points="${pine(x, 930, 420 + rnd() * 330, 70 + rnd() * 50)}" fill="#0b1a22" opacity=".95"/>`;
  }
  out += `<rect x="0" y="860" width="1600" height="60" fill="#08141b"/>`;
  g.innerHTML = out;   // сгенерировано здесь же, пользовательского ввода нет
}
function buildSidePanes() {
  const head = $("#rg-head");
  head.append(el("span", "u", `${C.nick}@${C.host}`), " ", el("span", "p", "~/socials"));
  const list = $("#rg-list"), foot = $("#rg-foot");
  const rows = C.socials.map((s, i) => {
    const url = safeUrl(s.url);
    const r = el(url ? "a" : "div", "rg-row");
    if (url) { r.href = url; r.target = "_blank"; r.rel = "noopener noreferrer"; }
    r.append(el("span", "n", s.cmd), el("span", "ar", "->"), el("span", "t", pretty(url || s.url || "")));
    const select = () => {
      rows.forEach((x, k) => x.classList.toggle("sel", k === i));
      foot.textContent = `lrwxrwxrwx 1 ${C.nick} ${C.nick}  ${s.label}   ${i + 1}/${C.socials.length}  All`;
    };
    r.addEventListener("mouseenter", select);
    r.addEventListener("focus", select);
    r.select = select;
    list.append(r);
    return r;
  });
  if (rows.length) rows[0].select();
}
function buildDock() {
  const colors = ["#e5c07b", "#c678dd", "#61afef", "#98c379", "#e06c75", "#56b6c2"];
  const items = [["fastfetch", "fastfetch"], ...C.socials.filter((s) => s.cmd).map((s) => [s.cmd, s.cmd.toLowerCase()]), ["theme", "theme toggle"], ["help", "help"]];
  const box = $("#chips");
  items.forEach(([label, cmd], i) => {
    const b = el("button", "chip", label);
    b.type = "button";
    b.style.setProperty("--c", colors[i % colors.length]);
    b.addEventListener("click", () => { run(cmd); if (!coarse) input.focus({ preventScroll: true }); });
    box.append(b);
  });
}
const setFocus = (w) => document.querySelectorAll(".win").forEach((x) => x.classList.toggle("focus", x === w));

function wireEvents() {
  promptEl.addEventListener("submit", (e) => {
    e.preventDefault();
    const v = input.value;
    input.value = "";
    if (v.trim() && hist[hist.length - 1] !== v) hist.push(v);
    hpos = hist.length;
    run(v);
  });
  input.addEventListener("keydown", (e) => {
    const end = () => input.setSelectionRange(input.value.length, input.value.length);
    if (e.key === "ArrowUp") { e.preventDefault(); if (hist.length) { hpos = Math.max(0, hpos - 1); input.value = hist[hpos]; end(); } }
    else if (e.key === "ArrowDown") { e.preventDefault(); hpos = Math.min(hist.length, hpos + 1); input.value = hist[hpos] ?? ""; end(); }
    else if (e.key === "Tab") { e.preventDefault(); complete(); }
    else if (e.ctrlKey && !e.shiftKey && !e.altKey) {
      const k = e.key.toLowerCase();
      if (k === "l") { e.preventDefault(); clearScreen(); }
      else if (k === "u") { e.preventDefault(); input.value = ""; }
      else if (k === "c" && input.selectionStart === input.selectionEnd) { e.preventDefault(); echo(input.value + "^C"); input.value = ""; toBottom(); }
    }
  });
  scr.addEventListener("click", (e) => {
    if (e.target.closest("a") || String(getSelection())) return;
    input.focus({ preventScroll: true });
  });
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing || e.key.length !== 1) return;
    if (/^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(e.target.tagName)) return;
    setFocus($("#w-term"));
    input.focus({ preventScroll: true });
  });
  document.querySelectorAll(".win").forEach((w) => w.addEventListener("pointerdown", () => setFocus(w)));
}

async function boot() {
  const first = "fastfetch";
  const hint = () => { line({ t: "напиши help — список команд, или жми кнопки внизу", c: "dim" }); toBottom(); };
  if (reduceMotion) { run(first); hint(); return; }
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    input.removeEventListener("keydown", finish);
    input.value = "";
    run(first);
    hint();
  };
  input.addEventListener("keydown", finish);   // начал печатать сам — сразу показываем результат
  for (const ch of first) {
    if (done) return;
    input.value += ch;
    await sleep(55 + Math.random() * 55);
  }
  await sleep(220);
  finish();
}

function init() {
  scr = $("#scr");
  document.title = `${C.nick}@${C.host}: ~`;
  if (hasAvatar()) { const ic = $('link[rel="icon"]'); ic.type = "image/webp"; ic.href = AVATAR; }
  if (C.nowPlaying) $("#np").textContent = "♪ " + C.nowPlaying;
  buildPrompt();
  buildForest();
  buildSidePanes();
  buildDock();
  let t = C.defaultTheme;
  try { const saved = localStorage.getItem("rice-theme"); if (saved && has(THEMES, saved)) t = saved; } catch { /* ок */ }
  setTheme(has(THEMES, t) ? t : "space", false);
  startTicker();
  wireEvents();
  if (!coarse) input.focus({ preventScroll: true });
  boot();
}

window.addEventListener("DOMContentLoaded", init);
})();
</script>
